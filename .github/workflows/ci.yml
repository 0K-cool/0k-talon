name: CI

# Public-repo CI. PR review handled by the CodeRabbit GitHub App
# (install: https://github.com/apps/coderabbitai) — not by workflow-level
# Claude CI actions, which burn Anthropic credits on every push.
#
# Why NOT the generic public-repo CI template from
# `0K-cool/vex .claude/templates/workflows/public-repo-ci.yml`:
# that template targets bun or pytest. 0k-talon is a pnpm + turbo
# workspace, so we run a pnpm-aware custom pipeline that ports the
# template's hardening lessons but swaps the runtime.
#
# Hardening lineage:
#   - PRs #17, #19, #20 on 0K-cool/vex (template evolution)
#   - PR #77 on 0K-cool/athena (athena's monorepo-aware custom CI)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only. Jobs opt UP from here, not DOWN — none need
# write right now.
permissions:
  contents: read

# Cancel in-progress runs only for PR events. Cancelling on push-to-main
# would let a force-push storm DoS the default-branch CI lane during
# release verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # NOT semgrep/semgrep-action — it runs `semgrep ci`, the semgrep-app mode.
      # Without SEMGREP_APP_TOKEN it errors, announces "Semgrep will succeed
      # because there were no blocking findings", and exits 0.
      #
      # Measured 2026-07-28 across every repo using this template — vex,
      # 0k-talon, 0k-rag, mnemosyne — all showed `semgrep ci` -> banner -> job
      # cleanup in 2-3 seconds. Scanning nothing. Reporting pass. Every run
      # since the template was written. On vex, the first real scan found two
      # live command injections.
      #
      # `semgrep scan` needs no token. Verified: clean file -> exit 0; a file
      # with eval() + shell=True -> exit 1, "Findings: 2 (2 blocking)".
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.2.0
        with:
          python-version: '3.12'
      - name: Semgrep scan
        run: |
          set -eo pipefail
          pip install --quiet 'semgrep>=1.100.0'
          # Rule exclusions triaged on vex against 109 real hits, not guessed:
          #  path-join-resolve-traversal — join(dir, entry.name) from readdirSync;
          #    a POSIX dirent name cannot contain a separator.
          #  detect-non-literal-regexp — these codebases BUILD detection patterns
          #    from config by design; flagging it flags the architecture.
          # detect-child-process is deliberately NOT excluded: on vex it found
          # the real injection.
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --metrics=off \
            --exclude='**/node_modules/**' \
            --exclude-rule=javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal \
            --exclude-rule=javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp

  vendor-drift:
    name: vendor drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Fetch each vendored artifact from its canonical source at the pinned ref
      # and fail if the committed copy has drifted. The vendored memory scanner
      # MUST stay byte-identical to the canonical in 0K-cool/mnemosyne.
      - name: Check vendored copies against canonical
        run: |
          set -eo pipefail
          ./scripts/sync-vendor.sh --check

  tests:
    name: pnpm + turbo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Hooks execute via Bun (hooks.json: `bun run …`). The subprocess tests
      # drive a hook through Bun and assert its exit code, so the runner needs it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
        # pnpm/action-setup@v5 errors (`Multiple versions of pnpm
        # specified`) when BOTH a `with: version:` input AND the
        # `packageManager:` field in package.json are set. The
        # `packageManager: pnpm@9.0.0` field is authoritative for
        # pnpm clients and Corepack, so we rely on it as the single
        # source of truth here — no `with: version:` input on purpose.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # `engines.node` in package.json declares `>=20.0.0`. Pinning
          # 20 here for reproducibility rather than `latest-lts`.
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: |
          set -eo pipefail
          # `--frozen-lockfile` pins the install to the resolved graph
          # in pnpm-lock.yaml — a fork PR cannot introduce new dep
          # resolutions at install time. pnpm has safer postinstall
          # defaults than npm so we do not `--ignore-scripts` unless
          # a specific package surfaces issues.
          pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          set -eo pipefail
          # `pnpm test` -> `turbo run test` -> invokes `vitest run` in
          # any workspace package that declares a `test` script.
          # turbo.json: tests dependsOn ^build, so shared packages
          # are built before tests execute.
          pnpm test
